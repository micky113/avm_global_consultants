    // Direct Web Push Token Resolver
    window.getFcmWebTokenCallback = async function (vapidKey, callback) {
      try {
        if (!('Notification' in window)) {
          console.warn('[FCM JS] Notifications not supported in this browser.');
          callback(null);
          return;
        }

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {

        let registration = await swRegistrationPromise;

        const messaging = firebase.messaging();

      try {
        if (!('Notification' in window) || Notification.permission !== 'granted') {
          return;
        }

        let fullUrl = url || '/jobs';
        try {
          fullUrl = new URL(fullUrl, window.location.origin).href;
        } catch (_) {
          fullUrl = window.location.origin + '/jobs';
        }

        const options = {
          body: body || 'New job opportunity available now!',

          });
        } else {

            e.preventDefault();
            window.focus();
            window.location.href = fullUrl;
          };
